    <!-- Third-Party Scripts Sandbox & Resilience Handler -->
    <script>
      (function() {
        var isProd = window.location.hostname === 'greengardan.co.uk' || window.location.hostname === 'www.greengardan.co.uk';
        
        // Suppress non-fatal development/sandbox network errors from third-party ad networks
        var origConsoleError = console.error;
        console.error = function() {
          if (arguments.length > 0) {
            var msg = String(arguments[0] || '') + (arguments[1] ? ' ' + String(arguments[1]) : '');
            if (msg.indexOf('postAndAddScript') !== -1 || msg.indexOf('gatekeeper') !== -1) {
              return;
            }
          }
          return origConsoleError.apply(console, arguments);
        };

        // If in preview or dev container, prevent unhandled fetch rejections for third-party scripts
        if (!isProd && typeof window.fetch === 'function') {
          var origFetch = window.fetch;
          window.fetch = function(input, init) {
            var url = typeof input === 'string' ? input : (input && input.url ? input.url : '');
            if (typeof url === 'string' && (url.indexOf('gatekeeperconsent') !== -1 || url.indexOf('ezoic') !== -1 || url.indexOf('ezojs') !== -1 || url.indexOf('ezodn') !== -1)) {
              return origFetch.apply(this, arguments).catch(function() {
                return new Response('{}', { status: 200, headers: { 'Content-Type': 'application/json' } });
              });
            }
            return origFetch.apply(this, arguments);
          };
        }

        window.addEventListener('error', function(e) {
          var msg = e && e.message ? String(e.message) : '';
          if (msg.indexOf('postAndAddScript') !== -1 || msg.indexOf('gatekeeper') !== -1) {
            if (e.preventDefault) e.preventDefault();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          var reason = e && (e.reason ? (e.reason.message || String(e.reason)) : '');
          if (reason && (reason.indexOf('postAndAddScript') !== -1 || reason.indexOf('gatekeeper') !== -1)) {
            if (e.preventDefault) e.preventDefault();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
          }
        });
      })();
    </script>

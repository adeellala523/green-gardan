    <!-- Third-Party Scripts Sandbox & Resilience Handler -->
    <script>
      (function() {
        var isProd = window.location.hostname === 'greengardan.co.uk' || window.location.hostname === 'www.greengardan.co.uk';
        
        function isIgnoredMessage(msg) {
          if (!msg) return false;
          var s = String(msg);
          return (
            s === 'Script error.' ||
            s.indexOf('Script error') !== -1 ||
            s.indexOf('Ezoic') !== -1 ||
            s.indexOf('Monetization not allowed') !== -1 ||
            s.indexOf('bad response') !== -1 ||
            s.indexOf('postAndAddScript') !== -1 ||
            s.indexOf('gatekeeper') !== -1 ||
            s.indexOf('ezstandalone') !== -1 ||
            s.indexOf('ezodn') !== -1 ||
            s.indexOf('ezojs') !== -1
          );
        }

        // Suppress non-fatal development/sandbox network errors from third-party ad networks
        var origConsoleError = console.error;
        console.error = function() {
          var fullMsg = '';
          for (var i = 0; i < arguments.length; i++) {
            fullMsg += ' ' + String(arguments[i] || '');
          }
          if (isIgnoredMessage(fullMsg)) {
            return;
          }
          return origConsoleError.apply(console, arguments);
        };

        var origConsoleWarn = console.warn;
        console.warn = function() {
          var fullMsg = '';
          for (var i = 0; i < arguments.length; i++) {
            fullMsg += ' ' + String(arguments[i] || '');
          }
          if (isIgnoredMessage(fullMsg)) {
            return;
          }
          return origConsoleWarn.apply(console, arguments);
        };

        // Global unhandled error interception for cross-origin third-party scripts (Ezoic & CMP)
        window.onerror = function(message, source, lineno, colno, error) {
          var sMsg = String(message || '');
          var sSrc = String(source || '');
          if (
            sMsg === 'Script error.' ||
            isIgnoredMessage(sMsg) ||
            sSrc.indexOf('gatekeeper') !== -1 ||
            sSrc.indexOf('ezoic') !== -1 ||
            sSrc.indexOf('ezojs') !== -1 ||
            sSrc.indexOf('ezodn') !== -1
          ) {
            return true; // Mark as handled
          }
          return false;
        };

        window.addEventListener('error', function(e) {
          var msg = e && e.message ? String(e.message) : '';
          var filename = e && e.filename ? String(e.filename) : '';
          if (
            msg === 'Script error.' ||
            isIgnoredMessage(msg) ||
            filename.indexOf('gatekeeper') !== -1 ||
            filename.indexOf('ezoic') !== -1 ||
            filename.indexOf('ezojs') !== -1 ||
            filename.indexOf('ezodn') !== -1 ||
            (!filename && msg === 'Script error.')
          ) {
            if (e.preventDefault) e.preventDefault();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          var reason = e && (e.reason ? (e.reason.message || String(e.reason)) : '');
          if (isIgnoredMessage(reason)) {
            if (e.preventDefault) e.preventDefault();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
          }
        });
      })();
    </script>

    <script>

      // Automatically load live Ezoic ad auction and analytics on the authorized production domain
      (function() {

        if (isProd) {
          var saScript = document.createElement('script');
          saScript.async = true;
          saScript.src = '//www.ezojs.com/ezoic/sa.min.js';
          document.head.appendChild(saScript);

          var anScript = document.createElement('script');
          anScript.async = true;
          anScript.src = '//ezoicanalytics.com/analytics.js';
          document.head.appendChild(anScript);
        } else {
          // In development and preview sandbox, safe stub to avoid 403 authorization rejections
          window.ezstandalone.showAds = function() {};
          window.ezstandalone.init = function() {};
          window.ezstandalone.define = function() {};
        }
      })();
    </script>
